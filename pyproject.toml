[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mca"
version = "0.1.0"
description = "A minimal local coding-agent runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[project.scripts]
mca = "mca.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
